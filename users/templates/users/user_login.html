{% extends 'users/base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="card">
    <div class="card-container">
        <form class="card-sub" method="post">
            <p class="card-title">Вход</p>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Войти</button>
            <p>
                <a href="{% url 'users:password-reset' %}">Забыли пароль?</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
